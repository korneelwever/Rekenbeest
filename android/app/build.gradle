plugins { id 'com.android.application' }

android {
    namespace 'nl.korneel.tafelbeest'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.korneel.tafelbeest'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('TAFELBEEST_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TAFELBEEST_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TAFELBEEST_KEY_ALIAS')
                keyPassword System.getenv('TAFELBEEST_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
