name: Build Rekenbeest APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Configure persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TAFELBEEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing TAFELBEEST_KEYSTORE_BASE64 and signing secrets. Follow the signing setup in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tafelbeest-release.jks"
          test -s "$RUNNER_TEMP/tafelbeest-release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          TAFELBEEST_KEYSTORE_PATH: ${{ runner.temp }}/tafelbeest-release.jks
          TAFELBEEST_KEYSTORE_PASSWORD: ${{ secrets.TAFELBEEST_KEYSTORE_PASSWORD }}
          TAFELBEEST_KEY_ALIAS: ${{ secrets.TAFELBEEST_KEY_ALIAS }}
          TAFELBEEST_KEY_PASSWORD: ${{ secrets.TAFELBEEST_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease
      - name: Validate APK
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: rekenbeest-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
